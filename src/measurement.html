<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>express-k6-profiler</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style></style>
  </head>
  <body class="">
    <div class="max-w-6xl mx-auto flex flex-col gap-2 my-4">
      <div class="flex items-center justify-between">
        <h1 class="text-sm font-bold">Express K6 Profiler</h1>
        <button
          id="resetBtn"
          onclick="fetch('__profile/reset', { method: 'POST' }).then(() => location.reload())"
          class="border px-6 border-gray-200 rounded-sm text-sm hover:cursor-pointer"
        >
          Clear Measurements
        </button>
      </div>

      <table>
        <thead class="border-b border-gray-200">
          <th class="font-light text-left pr-4 py-4">Avg Latency Contribution</th>
          <th class="font-light text-left pr-4">Title</th>
          <th class="font-light text-left pr-4">Total time</th>
          <th class="font-light text-left pr-4">Average time</th>
          <th class="font-light text-left pr-4">Counts</th>
          <th class="font-light text-left pr-4">Errors</th>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <dialog
      id="errorDialog"
      class="rounded-sm p-0 backdrop:bg-black/30 max-w-md w-full fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 m-0"
      onclick="if (event.target === this) this.close();"
    >
      <div class="p-4 flex flex-col gap-3">
        <div class="flex justify-between items-center">
          <h3 id="errorDialogTitle" class="font-semibold text-sm"></h3>
          <button
            class="text-gray-400 cursor-pointer text-lg leading-none"
            onclick="errorDialog.close()"
          >
            ✕
          </button>
        </div>
        <div id="errorDialogBody" class="flex flex-col gap-2"></div>
      </div>
    </dialog>

    <script>
      function addBar(cell, portion, parentPortions, parentPortionIndex, isParent) {
        const totalWidth = 200;
        const container = document.createElement('div');
        container.className =
          'relative h-4 overflow-hidden rounded-xs ' + (isParent ? 'border border-gray-200' : '');
        container.style.width = totalWidth + 'px';

        // draw all parent portions as gray outlines
        for (let i = 0; i < parentPortions.length; i++) {
          const p = parentPortions[i];
          const div = document.createElement('div');
          div.className = 'absolute top-0 h-full  border-gray-200';
          if (i === parentPortionIndex) div.className += ' border border-gray-200';
          div.style.left = p.start * totalWidth + 'px';
          div.style.width = Math.max(p.width * totalWidth, 1) + 'px';
          container.appendChild(div);
        }

        // draw this item's portion as solid blue
        if (portion.width > 0) {
          const div = document.createElement('div');
          div.className = 'absolute top-0 h-full';
          if (isParent) div.className += ' bg-blue-500';
          else div.className += ' bg-blue-200';
          div.style.left = portion.start * totalWidth + 'px';
          div.style.width = Math.max(portion.width * totalWidth, 1) + 'px';
          container.appendChild(div);
        }

        cell.appendChild(container);
      }

      setTimeout(() => {
        if (window.location.search.includes('reload=true')) window.location.reload();
      }, 1000);

      const main = async () => {
        const res = await fetch('__profile/json');
        const data = await res.json();
        const tbody = document.getElementById('tbody');
        if (!data.measurements || data.measurements.length === 0) {
          const row = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = 6;
          td.className = 'bg-blue-50 py-4 px-4 mt-4 rounded';
          td.textContent =
            'No profile data collected yet. Please run your k6 test to start profiling.';
          row.appendChild(td);
          tbody.appendChild(row);
          return;
        }

        for (const m of data.measurements) {
          const row = document.createElement('tr');
          const isParent = m.indents === 0;
          const isExcluded = m.excludePortion;

          const barTd = document.createElement('td');
          barTd.className = isParent ? ' pt-6 ' : ' ';
          addBar(barTd, m.portion, data.parentPortions, m.parentPortionIndex, isParent);
          row.appendChild(barTd);

          const nameTd = document.createElement('td');
          nameTd.className =
            (isParent ? ' pt-6 ' : ' ') +
            ' text-sm ' +
            (isExcluded || isParent ? '  ' : 'font-light');
          nameTd.textContent = (isParent ? '' : '↳ ') + m.name;
          row.appendChild(nameTd);

          const totalTd = document.createElement('td');
          totalTd.className =
            ' text-sm ' +
            (isParent ? 'pt-6 ' : '  ') +
            (isExcluded || isParent? '' : 'font-light');
          totalTd.textContent = m.totalMilis + ' ms';
          row.appendChild(totalTd);

          const avgTd = document.createElement('td');
          avgTd.className = ' text-sm font-light ' + (isParent ? 'pt-6 ' : ' ');
          avgTd.textContent = m.averageMilis + ' ms';
          row.appendChild(avgTd);

          const countTd = document.createElement('td');
          countTd.className = ' text-sm font-light ' + (isParent ? 'pt-6 ' : ' ');
          countTd.textContent = m.count;
          row.appendChild(countTd);

          const errorTd = document.createElement('td');
          errorTd.className = isParent ? 'pt-6' : '';
          if (m.errorHighlights) {
            const btn = document.createElement('button');
            btn.className =
              'text-xs text-red-500 bg-red-50 px-2 py-0.5 rounded hover:bg-red-100 cursor-pointer';
            btn.textContent = m.errorHighlights;
            btn.addEventListener('click', () => {
              errorDialogTitle.textContent = m.name;
              errorDialogBody.innerHTML = m.errors
                .map(
                  (e) => `
                <div class="flex items-center gap-2 text-xs bg-gray-50 p-2 rounded">
                  <span class=" text-red-600 px-1.5 py-0.5 rounded-sm font-mono shrink-0">${e.statusCode}</span>
                  <span class="text-gray-500">×${e.count}</span>
                  <pre class="overflow-x-auto flex-1">${e.lastMessage}</pre>
                </div>`,
                )
                .join('');
              errorDialog.showModal();
            });
            errorTd.appendChild(btn);
          }
          row.appendChild(errorTd);

          tbody.appendChild(row);
        }
      };
      main();
    </script>
  </body>
</html>
